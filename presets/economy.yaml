# ===== 인스턴스 =====
data_dir: "data/economy"
style_notes: "style_notes/economy.md"
telegram_token_env: "TELEGRAM_BOT_TOKEN"

# ===== 운영 설정 =====
# candidates = 아침에 봇이 후보 추천 / remind = 아침엔 알림만, 글감은 내가 보냄 (추천 비용 절약)
daily_mode: "candidates"
posts_per_day: 2
# 서버(GitHub) 모드: 이 시각마다 글을 나눠서 생성 → 바로 발행하면 골든타임에 걸림
post_slots: ["07:20", "12:00"]
# homefeed = 홈판용 후킹 제목만 / search = 검색용 제목만 (한 계정에 섞지 않기)
title_mode: "homefeed"
schedule_times: ["07:30"]   # 조간 보도자료가 전날 저녁~새벽에 풀려서 아침 1회로 충분
candidate_pool: 12
candidates_per_run: 6
news_per_seed: 10
news_max_age_hours: 48
timezone: "Asia/Seoul"
# 예약발행 추천 시간대. n번째 글은 n번째 창에서 랜덤 분으로 추천.
publish_windows: [["07:30", "09:30"], ["12:00", "13:30"]]   # 골든타임(07~19시) 안에서 출근길·점심
# 초안 쓸 때 AI가 공식 사이트를 직접 검색해 사실 확인 (검색 1,000회당 $10, 글당 최대 3회)
web_search: true
# 글마다 내가 직접 한두 줄 쓰는 칸 수 (0~2). 0이면 AI 글 그대로라 계정 리스크가 커짐
me_blocks: 1
model: "claude-sonnet-5-5"

# ===== 정부 보도자료 (공공데이터포털 '문화체육관광부_정책브리핑_보도자료_API') =====
use_press_releases: true
press_endpoint: "https://apis.data.go.kr/1371000/pressReleaseService/pressReleaseList"
press_days: 2               # 최근 며칠치 (API 조회기간 제한이 있어 3일 이하 권장)
press_max_items: 30
# 생활경제와 관련 있는 부처만. 부처명 일부만 맞아도 통과.
press_ministries:
  - 재정경제부
  - 기획예산처
  - 보건복지부
  - 고용노동부
  - 국토교통부
  - 행정안전부
  - 국세청
  - 관세청
  - 금융위원회
  - 공정거래위원회
  - 산업통상부
  - 기후에너지환경부
  - 중소벤처기업부
  - 농림축산식품부
  - 성평등가족부
  - 교육부
  - 국가보훈부
  - 방송미디어통신위원회

# ===== 카드 이미지 =====
font_path: "fonts/Pretendard-ExtraBold.otf"   # 폴더에 같이 들어있는 폰트 (윈도우·서버 공통)
font_index: 0
card_colors: ["#0B2545", "#FFC94A"]   # 배경, 강조색
card_label: ""

# ===== 주제 =====
category: "생활경제"
seed_keywords:
  - 지원금 신청
  - 환급금
  - 근로장려금
  - 청년 지원
  - 전기요금
  - 건강보험료
  - 국민연금
  - 연말정산
  - 세금 감면
  - 대출 금리 인하
  - 알뜰폰 요금제
  - 교통비 환급

blocklist: [사망, 사고, 살인, 성범죄, 마약, 사기 피해자, 자살]

topic_rules: |
  - 독자가 직접 '받거나, 아끼거나, 신청하거나, 피할' 수 있는 정보가 있는 주제만: 지원금·환급·감면·요금 변경·신청 기한·자격 조건.
  - 정부 보도자료([시드: 정부 보도자료])로 뒷받침되는 주제를 우선한다. 같은 이슈의 뉴스와 보도자료가 둘 다 있으면 둘 다 source_ids에 넣는다.
  - keyword는 '정책명 + 신청방법/대상/금액/기간/조회' 같은 롱테일.
  - entity에는 정책명·제도명만 넣는다 (예: 근로장려금, K-패스). 데이터랩 검색량 측정용.
  - 여야 공방, 정책 찬반 같은 정치 논쟁형은 제외. 시행이 확정되지 않은 '검토 중' 정책은 제외.

draft_rules: |
  - 금액, 대상, 기간, 신청처, 소득 기준은 정부 보도자료 출처가 있으면 반드시 그것을 기준으로 쓴다. 뉴스와 다르면 보도자료를 따르고 fact_checks에 차이를 적는다.
  - 도입부에 'OOOO년 O월 기준' 기준일을 밝힌다. 제도는 바뀌기 때문.
  - 신청 방법은 단계별로 짧게. 사이트·앱 이름은 출처에 있는 것만.
  - 투자 권유, 특정 금융상품 추천, 개인 상황별 세무·법률 판단 금지. 개인 상황은 '담당 기관 확인'으로 안내.
  - 출처 표기는 시스템이 자동으로 붙이므로 본문에 따로 쓰지 않는다.

media_rule: |
  이미지 블록은 두 종류만 쓴다. 뉴스 사진, 정부 인포그래픽 원본은 쓰지 않는다 (이용조건이 자료마다 달라서).
  - "card": 자동 생성 텍스트 카드. content는 1~2줄, 총 30자 이내. 숫자를 크게 (예: "최대 330만원\n5월 31일까지"). 4~5개.
  - "photo": 글쓴이가 직접 캡처할 공식 신청 화면 (예: "홈택스 근로장려금 신청 첫 화면"). 1~2개. 출처에 나온 사이트만.
