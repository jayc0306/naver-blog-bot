# ===== 인스턴스 =====
data_dir: "data/entertainment"           # DB와 output이 프리셋별로 분리됨
style_notes: "style_notes/entertainment.md"
telegram_token_env: "TELEGRAM_BOT_TOKEN_ENT"   # 2호기는 봇을 하나 더 만들어 별도 토큰 사용
use_press_releases: false

# ===== 운영 설정 =====
# candidates = 아침에 봇이 후보 추천 / remind = 아침엔 알림만, 글감은 내가 보냄 (추천 비용 절약)
daily_mode: "candidates"
posts_per_day: 2
# 서버(GitHub) 모드: 이 시각마다 글을 나눠서 생성 → 바로 발행하면 골든타임에 걸림
post_slots: ["07:20", "12:00"]
# homefeed = 홈판용 후킹 제목만 / search = 검색용 제목만 (한 계정에 섞지 않기)
title_mode: "homefeed"
schedule_times: ["07:30", "18:30"]   # 연예는 속도 싸움이라 하루 두 번 후보 수집 (회당 1개 발행)
candidate_pool: 12        # Claude가 뉴스에서 뽑는 1차 후보 수
candidates_per_run: 4     # 데이터랩 상승률로 거른 뒤 텔레그램에 보낼 수
news_per_seed: 15
news_max_age_hours: 24
timezone: "Asia/Seoul"
# 예약발행 추천 시간대. n번째 글은 n번째 창에서 랜덤 분으로 추천.
publish_windows: [["07:30", "09:30"], ["12:00", "13:30"]]   # 골든타임(07~19시) 안에서 출근길·점심
# 초안 쓸 때 AI가 공식 사이트를 직접 검색해 사실 확인 (검색 1,000회당 $10, 글당 최대 3회)
web_search: true
# 글마다 내가 직접 한두 줄 쓰는 칸 수 (0~2). 0이면 AI 글 그대로라 계정 리스크가 커짐
me_blocks: 1
model: "claude-sonnet-5-5"

# ===== 카드 이미지 (연예는 직접 찍을 사진이 없어서 텍스트 카드로 대체) =====
font_path: "fonts/Pretendard-ExtraBold.otf"   # 폴더에 같이 들어있는 폰트 (윈도우·서버 공통)
font_index: 0
card_colors: ["#111111", "#FFD400"]   # 배경, 강조색
card_label: ""                        # 카드 좌하단에 넣을 블로그 이름 (비우면 없음)

# ===== 주제 =====
category: "방송·연예"
# 뉴스 수집용 시드. 고유명사(작품명·인물명)는 Claude가 뉴스에서 뽑고 데이터랩으로 상승률을 잰다.
seed_keywords:
  - 드라마 시청률
  - 첫방송
  - 종영
  - 예능 출연
  - 넷플릭스 공개
  - 티빙 공개
  - 디즈니플러스 공개
  - 캐스팅 확정
  - 컴백
  - 촬영지
  - OST 발매
  - 시즌2 제작

# 이 단어가 키워드·각도에 들어가면 제외 (명예훼손·사생활 리스크)
blocklist: [열애, 결별, 이혼, 불륜, 사망, 별세, 사고, 음주운전, 학폭, 마약, 폭행, 고소, 고발, 루머, 의혹, 논란, 성형, 몸매, 임신, 재산]

topic_rules: |
  - 확인 가능한 공식 정보가 중심인 주제만: 편성·방송시간, 몇부작, 시청률, 출연진·등장인물, OTT 공개일·어디서 보는지, 촬영지, OST, 시즌2·후속작, 원작.
  - keyword는 실제 검색할 롱테일: '작품명 + 몇부작/출연진/촬영지/OTT/결말/원작/시청률' 같은 형태.
  - entity에는 keyword의 핵심 고유명사(작품명 또는 인물명)만 넣는다. 데이터랩 검색량 측정용.
  - 사생활, 연애, 사건사고, 루머, 외모 평가, 논란 주제 제외.

draft_rules: |
  - 공식 발표, 방송사·OTT 편성, 시청률(조사기관 명시), 출연진 등 출처로 확인되는 사실만 쓴다.
  - 다른 매체의 보도 내용은 'OO 보도에 따르면'처럼 출처를 밝힌다.
  - 인물에 대한 비방, 조롱, 외모 평가, 사생활 추측 금지. 확인되지 않은 전개 예측은 '예상'으로 명확히 구분.
  - 스포일러가 있으면 해당 소제목 앞에 '스포 주의'를 적는다.

media_rule: |
  이미지 블록은 두 종류만 쓴다. 보도사진·방송 캡처·인물 사진은 저작권과 초상권 때문에 절대 쓰지 않는다.
  - "card": 자동 생성되는 텍스트 카드. content는 카드에 들어갈 문구 1~2줄, 총 30자 이내 (예: "총 12부작\n금토 밤 10시"). 4~5개.
  - "embed": 글쓴이가 공식 유튜브 채널에서 찾아 임베드할 영상. content는 어떤 영상을 찾을지 (예: "tvN 공식 채널의 1차 예고편"). 1개.
