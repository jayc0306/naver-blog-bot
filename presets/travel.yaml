# ===== 인스턴스 =====
data_dir: "data/travel"
style_notes: "style_notes/travel.md"
telegram_token_env: "TELEGRAM_BOT_TOKEN"

# ===== 운영 설정 =====
# candidates = 아침에 봇이 후보 추천 / remind = 알림만, 글감은 내가 보냄
daily_mode: "candidates"
posts_per_day: 2
# 서버(GitHub) 모드: 이 시각마다 글을 나눠서 생성 → 바로 발행하면 골든타임에 걸림
post_slots: ["07:20", "12:00"]
# homefeed = 홈판용 후킹 제목만 / search = 검색용 제목만 (한 계정에 섞지 않기)
title_mode: "homefeed"
schedule_times: ["07:30"]
candidate_pool: 12
candidates_per_run: 6
news_per_seed: 10
news_max_age_hours: 72
timezone: "Asia/Seoul"
publish_windows: [["07:30", "09:30"], ["12:00", "13:30"]]   # 골든타임(07~19시) 안에서 출근길·점심
web_search: true          # 날짜·시간·요금 확인용. 행사 정보는 틀리면 치명적이라 켜두는 걸 강력 추천
me_blocks: 1
model: "claude-sonnet-5-5"

# ===== 축제·행사 데이터 (한국관광공사 TourAPI, 공공데이터포털 키 공용) =====
# data.go.kr 에서 '한국관광공사_국문 관광정보 서비스' 활용신청 필요. 요청주소가 다르면 아래를 바꿀 것.
use_festivals: true
festival_endpoint: "https://apis.data.go.kr/B551011/KorService2/searchFestival2"
festival_days_ahead: 30   # 2~4주 전 선점 글도 노림 (홈판 노출된 사천에어쇼 글은 3주 전에 발행)
use_press_releases: false

# 후기 모드 (텔레그램에 '후기: 장소명' + 메모를 보낼 때)
review_rules: |
  - 글쓴이가 직접 다녀온 후기다. 메모에 있는 경험·시간·숫자·가격·감정을 그대로 살리고, 메모에 없는 경험은 절대 지어내지 않는다.
  - 구조: 📍 장소명 + 한 줄 요약 → 시간 순서 소제목(도착·대기 → 입장 → 메뉴·구매 → 가격 → 총평).
  - 1인칭 구어체(~했어요, ~더라구요). ➡️ 같은 화살표로 핵심 숫자를 강조. 솔직한 한마디는 살리되 과장하지 않는다.
  - 마지막은 다시 갈지, 누구에게 추천하는지 솔직한 결론.
  - 영업시간·주소 같은 매장 정보는 확인된 것만.
  - 이미지는 photo(글쓴이가 찍은 사진 자리, 메모에 나온 장면 위주 4~6개)와 card(핵심 숫자 1~2개)만. aiimg는 쓰지 않는다.

# ===== 카드 이미지 =====
font_path: "fonts/Pretendard-ExtraBold.otf"
font_index: 0
card_colors: ["#1F2A24", "#F2A65A"]   # 짙은 숲색 + 단풍 주황
card_label: ""

# ===== 주제 =====
category: "주말 나들이 정보 (축제·공연·전시)"
seed_keywords:
  - 이번 주말 축제
  - 축제 일정 2026
  - 단풍 절정
  - 단풍 명소 예약
  - 불꽃축제
  - 빛축제
  - 에어쇼
  - 박람회 일정
  - 가볼만한곳 개장
  - 먹거리 축제
  - 국립공원 예약제
  - 아이와 가볼만한곳 행사
  - 지역 축제 개막
  - 뮤지컬 캐스팅 공개
  - 티켓 오픈 일정
  - 전시 개막
  - 내한 공연 예매

blocklist: [사망, 사고, 압사, 화재, 폭행, 성범죄, 논란]

topic_rules: |
  - 지금 진행 중이거나 앞으로 4주 안에 열리는 축제, 행사, 시즌 명소(단풍, 불꽃, 빛축제, 에어쇼, 박람회 등), 그리고 공연·전시(뮤지컬, 연극, 콘서트, 전시)만.
  - 전국구 초대형 행사(이미 큰 블로그들이 장악)보다 **중소 지역 축제**를 우선한다. 관심은 있는데 정리한 글이 적은 곳이 새 블로그에 유리하다. (예: 김천 김밥축제 글이 화담숲·사천에어쇼보다 조회수 10배)
  - 공연·전시는 정보형만: 캐스팅 공개, 티켓 오픈 일정, 가격·좌석, 공연 시간, 관람 등급. 배우 사생활·열애·논란 같은 연예 가십은 제외.
  - 2~4주 남은 큰 행사는 '선점 글'로 가치가 높다 (공식 일정이 막 공개된 시점). 이번 주말 행사는 '총정리·당일 팁' 각도로.
  - 정보형 주제만: 일정, 시간표, 예약 방법, 입장료, 주차·셔틀, 추천 동선. 직접 다녀와야 쓸 수 있는 후기·맛집 리뷰는 제외.
  - keyword는 '2026 + 행사·장소명 + 일정/예약/입장료/주차/시간표' 형태의 롱테일.
  - entity에는 행사·장소명만 (예: 사천에어쇼, 화담숲). 데이터랩 검색량 측정용.
  - 같은 행사는 경쟁 글이 많다. angle에 반드시 차별 포인트를 적는다: '언제 가야 하나(요일·시간 추천)', '아이와/부모님과', '동선 추천', '가격 비교', '예약 꿀팁' 등.
  - [시드: 다가오는 축제·행사(관광공사)] 항목은 공식 데이터라 우선 고려한다.

draft_rules: |
  - 도입 2~4줄: 계절감이나 '이번 주말' 한 줄 + 바로 핵심 날짜·장소. 결론 먼저.
  - 도입 직후 핵심 요약표(table 블록)를 넣는다: 기간, 장소, 운영시간, 입장료, 예약, 주차·교통 중 확인된 것만 5~7줄.
  - 소제목은 이모지로 시작 (📅 일정 🎟 예약·입장료 🚗 주차·셔틀 🗺 추천 동선 ✅ 준비물 체크리스트 📍 위치 등).
  - 시간표가 있으면 날짜별로 정리하고, '언제 가면 좋은지'를 근거와 함께 판단해 준다 (예: 토요일 오전 추천과 이유).
  - 날짜·시간·요금·예약 방법은 공식 홈페이지·관광공사·지자체 출처로 확인된 것만. 확인 못 한 항목은 '공식 홈페이지에서 확인하세요'로 안내만 하고 숫자를 만들지 않는다.
  - 공식 프로그램이 여러 개면 분류별로 '■ 분류명' 아래 '날짜 : 프로그램 / 장소' 줄로 빠짐없이 텍스트로 적는다 (검색 노출과 체류시간에 유리).
  - 주차장·셔틀 승하차장이 여럿이면 '▶ 장소명 : 주소, 소요시간' 줄로 전부 적는다.
  - 같은 기간 근처에서 열리는 연계 행사(무료 공연, 출연진 등)가 출처에 있으면 마지막 섹션으로 소개한다.
  - 준비물 체크리스트를 넣는다 (신분증·예약 QR, 편한 신발, 겉옷 등 행사에 맞게).
  - 공연·전시 글 구조: 도입(작품 한 줄 소개 + 기간·장소) → 📌 공연 정보 요약표(기간, 장소, 가격, 러닝타임, 관람 등급, 예매처, 티켓 오픈) → 🔍 어떤 작품인지 → ✨ 이번 시즌 달라진 점 → 🎭 전체 캐스팅 → 🕰 요일별 공연 시간 → 🎟 티켓 가격과 예매 → ✅ 체크리스트 → 📍 공연장. 마무리 질문은 '어떤 캐스팅 조합으로 보고 싶은지'처럼.
  - 공연 태그에는 작품명 변형 + 배우 이름 + 공연장 + '12월뮤지컬' 같은 월 키워드를 넣는다.
  - 마무리: 핵심 3~4줄 재요약 + '일정은 변경될 수 있으니 방문 전 공식 안내 확인' + 댓글 유도 질문 한 줄.
  - 글쓴이가 다녀온 척하는 경험담('작년에 가보니')을 지어내지 않는다. 경험은 me 블록으로만.
  - 태그는 중요한 순서대로: 행사명 변형(일정·주차·셔틀 붙인 것), 핵심 프로그램명, 출연진 이름, 지역+가볼만한곳, 월+가볼만한곳, 대상(아이와, 부모님). 15~25개 (네이버는 최대 30개, 넘치면 자동으로 잘림).

media_rule: |
  이미지 블록 종류. 뉴스·블로그 사진, 공식 포스터를 그대로 가져오지 않는다.
  - "table": 핵심 요약표. content는 '항목|내용' 형식 줄들 (예: "기간|10월 22일~25일"). 1개.
  - "card": 자동 생성 텍스트 카드. 1~2줄, 30자 이내, 숫자·날짜 강조. 2~3개.
  - "aiimg": 글쓴이가 다른 AI 도구로 만들 이미지의 프롬프트. 2~3개. 한국어로 장면·구도·빛·계절감을 구체적으로,
    끝에 '사진처럼 사실적으로, 가로 4:3, 글자·로고·실존 인물 없이'를 붙인다. 실제 장소의 특정 건물·간판을 정확히 재현하려 하지 말고 분위기 이미지로.
  - "place": 지도 첨부할 장소명 1개 (예: "화담숲").
  - "photo": 글쓴이가 공식 홈페이지에서 캡처할 안내 화면 (전체 일정표, 주차장·셔틀 지도, 출입등록 안내). 0~2개. 출처 표기 전제.
  - "link": 공식 홈페이지·예매·사전등록 페이지. content는 '라벨|https://주소'. 1~2개. 출처나 web_search로 실제 확인한 주소만.
